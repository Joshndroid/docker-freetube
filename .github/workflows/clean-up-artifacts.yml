name: Cleanup Artifacts

on:
  schedule:
    - cron: '0 1 * * *' # daily at 01:00 UTC
  workflow_dispatch:

jobs:
  cleanup-general:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove artifacts older than 30 days (excluding last_freetube_id)
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '30 days'
          skip-names: 'last_freetube_id'

  cleanup-freetube-id:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove last_freetube_id artifacts older than 60 days
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '60 days'
          name: 'last_freetube_id'
