name: Check for New FreeTube Release (Dev)

on:
  schedule:
    - cron: '0 6 * * 0' # every Sunday at 06:00 UTC
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get latest FreeTube release ID
        id: freetube_release
        run: |
          RELEASE_ID=$(curl -sL 'https://api.github.com/repos/FreeTubeApp/FreeTube/releases' \
            | jq -r 'map(select(.prerelease)) | first | .id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Download previous last release artifact
        uses: actions/download-artifact@v4
        with:
          name: last_freetube_id
          path: ./last_id
        continue-on-error: true

      - name: Read last release
        id: last_release
        run: |
          if [ -f ./last_id/.last_freetube_id ]; then
            LAST_ID=$(cat ./last_id/.last_freetube_id)
          else
            LAST_ID=""
          fi
          echo "last_id=$LAST_ID" >> $GITHUB_OUTPUT

      - name: Compare and trigger dev build
        if: steps.freetube_release.outputs.release_id != steps.last_release.outputs.last_id
        run: |
          echo "New FreeTube release detected. Triggering Docker build on selkies-dev..."
          gh workflow run "Build and Publish Docker image" \
            --repo ${{ github.repository }} \
            --ref selkies-dev \
            --field release_id=${{ steps.freetube_release.outputs.release_id }}