name: Check for New FreeTube Release (Dev)

on:
  schedule:
    - cron: '0 6 * * 0' # every Sunday at 06:00 UTC
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed for gh CLI auth
    steps:
      - name: Get latest FreeTube release ID
        id: freetube_release
        run: |
          RELEASE_ID=$(curl -sL 'https://api.github.com/repos/FreeTubeApp/FreeTube/releases' \
            | jq -r 'map(select(.prerelease)) | first | .id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Trigger dev Docker build
        if: steps.freetube_release.outputs.release_id != ''
        run: |
          echo "New FreeTube release detected. Triggering Docker build on selkies-dev branch..."
          # Use the workflow ID or filename with explicit repo reference
          gh workflow run docker-publish.yml --repo ${{ github.repository }} -f ref=selkies-dev