name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get latest FreeTube prerelease tag
        id: freetube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/FreeTubeApp/FreeTube/releases" \
            | jq -r 'map(select(.prerelease)) | sort_by(.published_at) | reverse | first | .tag_name')
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
            FREETUBE_VERSION=${{ steps.freetube.outputs.version }}
          tags: |
            ghcr.io/joshndroid/docker-freetube:latest
            ghcr.io/joshndroid/docker-freetube:${{ github.ref_name }}
