name: Build and Publish Release Docker image

on:
  push:
    tags:
      - 'v*'   # Triggers on tags like v1.2.3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Extract package_versions.txt from image
        run: |
          # Use the first tag from metadata
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | head -n 1)
          echo "Trying IMAGE_TAG=$IMAGE_TAG"
          
          docker pull $IMAGE_TAG
          docker create --name temp_container $IMAGE_TAG || exit 1
          
          if ! docker cp temp_container:/package_versions.txt ./package_versions.txt 2>/dev/null; then
            echo "Versioned tag missing package_versions.txt, falling back to latest"
            docker rm temp_container
            IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | grep 'latest' | head -n 1)
            echo "Using fallback IMAGE_TAG=$IMAGE_TAG"
            docker pull $IMAGE_TAG
            docker create --name temp_container $IMAGE_TAG
            docker cp temp_container:/package_versions.txt ./package_versions.txt
          fi
          
          docker rm temp_container

      - name: Upload package_versions.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: package_versions
          path: ./package_versions.txt